# Infrastructure Services Catalog (Structured)
# Last verified: February 2026
# For AI agent context — load when user asks about hosting, deployment, infrastructure

hosting:
  - name: Vercel
    url: https://vercel.com
    type: Frontend + Serverless
    free_tier: true
    paid_from: $20/mo (Pro)
    best_for: Next.js, React, static sites
    status: active
    notes: Market leader for frontend. Edge functions. Analytics built-in.

  - name: Netlify
    url: https://netlify.com
    type: JAMstack hosting
    free_tier: true
    paid_from: $19/mo (Pro)
    best_for: Static sites, JAMstack
    status: active

  - name: Cloudflare Pages
    url: https://pages.cloudflare.com
    type: Static + Workers
    free_tier: true (unlimited bandwidth)
    paid_from: $0 (Workers paid plan $5/mo)
    best_for: Static sites needing global CDN, Workers for compute
    status: active
    notes: Zero bandwidth costs. Workers for serverless.

  - name: Railway
    url: https://railway.com
    type: Full-stack PaaS
    free_tier: false
    paid_from: $5/mo + usage
    best_for: Full-stack apps, databases, background workers
    status: active
    notes: Great DX. Docker-based. Easy Postgres/Redis add-ons.

  - name: Fly.io
    url: https://fly.io
    type: Edge containers
    free_tier: limited
    paid_from: Pay-as-you-go
    best_for: Global low-latency apps, multi-region
    status: active

  - name: Render
    url: https://render.com
    type: PaaS (Heroku alternative)
    free_tier: true (spins down after inactivity)
    paid_from: $7/mo
    best_for: Simple deployments, Heroku migration
    status: active

  - name: DigitalOcean
    url: https://digitalocean.com
    type: Cloud / App Platform
    free_tier: false
    paid_from: $5/mo (droplet), $5/mo (App Platform)
    best_for: VPS, managed Kubernetes
    status: active

databases:
  - name: Supabase
    url: https://supabase.com
    type: Postgres + Auth + Realtime + Storage
    free_tier: true (generous)
    paid_from: $25/mo (Pro)
    best_for: Full-stack apps needing auth + DB + realtime
    status: active
    notes: Open source Firebase alternative. pgvector support.

  - name: Neon
    url: https://neon.tech
    type: Serverless Postgres
    free_tier: true
    paid_from: Usage-based (80% price cut in 2025)
    best_for: Serverless apps, branching for dev/preview
    status: active
    notes: Database branching. Auto-scaling. Very competitive pricing.

  - name: PlanetScale
    url: https://planetscale.com
    type: Serverless MySQL
    free_tier: false (killed free tier 2024)
    paid_from: $39/mo (Hobby)
    best_for: MySQL at scale
    status: changed
    notes: Free tier removed. Consider Neon or Supabase instead.

  - name: Turso
    url: https://turso.tech
    type: SQLite at edge (libSQL)
    free_tier: true (9GB)
    paid_from: $29/mo
    best_for: Edge applications, embedded databases
    status: active

  - name: Upstash
    url: https://upstash.com
    type: Serverless Redis + Kafka + QStash
    free_tier: true
    paid_from: Pay per request
    best_for: Caching, rate limiting, message queues
    status: active

  - name: MongoDB Atlas
    url: https://mongodb.com
    type: Document database
    free_tier: true (512MB)
    paid_from: $0.10/hr (flexible)
    best_for: Document-heavy apps, flexible schema
    status: active

  - name: CockroachDB
    url: https://cockroachlabs.com
    type: Distributed SQL
    free_tier: true (10GB)
    paid_from: Usage-based
    best_for: Multi-region, high availability
    status: active

auth:
  - name: Clerk
    url: https://clerk.com
    type: Drop-in auth service
    free_tier: true (10K MAU)
    paid_from: $25/mo (Pro)
    best_for: Next.js apps, fast integration
    status: active
    notes: Best DX. Pre-built components.

  - name: Auth.js
    url: https://authjs.dev
    type: Open source auth library
    free_tier: true (self-hosted)
    paid_from: Free
    best_for: Custom auth, full control
    status: active
    notes: Successor to NextAuth.

  - name: Supabase Auth
    url: https://supabase.com/auth
    type: Built-in auth (part of Supabase)
    free_tier: true
    paid_from: Included in Supabase plan
    best_for: Already using Supabase
    status: active

  - name: Lucia Auth
    url: https://lucia-auth.com
    type: Auth library
    free_tier: true
    paid_from: Free
    best_for: N/A
    status: deprecated
    notes: Deprecated 2024. Recommends building custom with Oslo libraries.

  - name: WorkOS
    url: https://workos.com
    type: Enterprise SSO/SCIM
    free_tier: true (SSO)
    paid_from: Usage-based
    best_for: B2B apps needing enterprise auth
    status: active

